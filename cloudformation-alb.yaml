AWSTemplateFormatVersion: '2010-09-09'
Description: 'Bedrock Model Monitoring - CloudFront -> ALB -> Existing EC2'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "Existing VPC ID"

  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: "Public Subnet A (for ALB)"

  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: "Public Subnet B (for ALB)"

  CloudFrontPrefixListId:
    Type: String
    Description: "CloudFront origin-facing managed prefix list ID"

  ExistingInstanceId:
    Type: String
    Description: "Existing EC2 Instance ID to target"

  ExistingInstanceSGId:
    Type: String
    Description: "Existing EC2 Security Group ID (to add ALB ingress rule)"

Resources:
  # ============================================================
  # Security Groups
  # ============================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ALB SG - HTTP from CloudFront only"
      GroupName: !Sub '${AWS::StackName}-ALB-SG'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: "HTTP from CloudFront origin-facing only"
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ALB-SG'

  # Allow ALB -> EC2 port 3000 via existing EC2 SG
  EC2IngressFromALB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ExistingInstanceSGId
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref ALBSecurityGroup
      Description: "Next.js from ALB"

  # ============================================================
  # ALB
  # ============================================================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-ALB"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: 3600
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ALB'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-TG"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: "/api/health"
      HealthCheckPort: "3000"
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: 200
      Targets:
        - Id: !Ref ExistingInstanceId
          Port: 3000
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30
        - Key: stickiness.enabled
          Value: true
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: 86400
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-TG'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: 403
            ContentType: text/plain
            MessageBody: Access Denied

  ALBListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Custom-Secret
            Values:
              - !Sub '${AWS::StackName}-secret-${AWS::AccountId}'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ============================================================
  # CloudFront
  # ============================================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Bedrock Monitoring Dashboard - ${AWS::StackName}"
        Origins:
          - Id: ALBOrigin
            DomainName: !GetAtt ALB.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
            OriginCustomHeaders:
              - HeaderName: X-Custom-Secret
                HeaderValue: !Sub '${AWS::StackName}-secret-${AWS::AccountId}'
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
            Headers: ['*']
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Restrictions:
          GeoRestriction:
            RestrictionType: none
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-CF'

Outputs:
  DashboardURL:
    Description: "Dashboard URL (CloudFront)"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  ALBDNS:
    Description: "ALB DNS Name"
    Value: !GetAtt ALB.DNSName

  Architecture:
    Description: "Network path"
    Value: "CloudFront (HTTPS) -> ALB (HTTP:80 + Custom Header) -> EC2 (Next.js:3000)"
