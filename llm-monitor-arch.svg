<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-label="Amazon Bedrock LLM Monitor 아키텍처: 사용자는 CloudFront와 Internal ALB를 거쳐 Next.js 프런트엔드·FastAPI 백엔드에 접속하고, EventBridge Scheduler가 AutoProber·Insights·ParityRun Fargate 태스크를 기동하고, AutoProber와 ParityRun이 5개 호출 경로의 LLM 프로바이더를 실측한 뒤 RDS PostgreSQL에 저장합니다.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F5A4D"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97757"/>
    </marker>
  </defs>

  <style>
    .t{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .card{fill:#FFFFFF;stroke:#D7D3C7;stroke-width:1.5;rx:12}
    .name{font-size:19px;font-weight:700;fill:#1F1E1D}
    .sub{font-size:14px;fill:#5F5A4D}
    .lbl{font-size:13px;fill:#6B665A;letter-spacing:.08em}
    .flow{stroke:#5F5A4D;stroke-width:1.8;fill:none}
    .flowA{stroke:#D97757;stroke-width:2.2;fill:none}
    .edge{font-size:12.5px;fill:#6B665A}
    .edgeA{font-size:12.5px;fill:#8E4830;font-weight:600}
  </style>

  <rect x="0" y="0" width="1400" height="860" fill="#FAF9F5"/>

  <!-- AWS Cloud boundary (ap-northeast-2) -->
  <rect x="292" y="48" width="762" height="772" rx="18" fill="#FFFFFF" fill-opacity="0.45" stroke="#B5AFA0" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text class="m lbl" x="316" y="80">AWS CLOUD · ap-northeast-2 (SEOUL)</text>

  <!-- 사용자 -->
  <rect x="52" y="150" width="196" height="96" rx="12" class="card"/>
  <text class="t name" x="76" y="190">사용자</text>
  <text class="t sub" x="76" y="216">브라우저 · 모바일</text>

  <!-- CloudFront -->
  <rect x="330" y="118" width="212" height="96" rx="12" class="card"/>
  <text class="t name" x="352" y="156">CloudFront</text>
  <text class="t sub" x="352" y="182">VPC Origin · HTTPS</text>

  <!-- Internal ALB -->
  <rect x="330" y="272" width="212" height="96" rx="12" class="card"/>
  <text class="t name" x="352" y="310">Internal ALB</text>
  <text class="t sub" x="352" y="336">/api/* · /* 라우팅</text>

  <!-- Frontend -->
  <rect x="608" y="118" width="230" height="96" rx="12" class="card"/>
  <text class="t name" x="630" y="156">Frontend</text>
  <text class="t sub" x="630" y="182">Next.js 14 · ECS Fargate</text>

  <!-- Backend -->
  <rect x="608" y="272" width="230" height="96" rx="12" class="card"/>
  <text class="t name" x="630" y="310">Backend</text>
  <text class="t sub" x="630" y="336">FastAPI · ECS Fargate</text>

  <!-- RDS -->
  <rect x="880" y="180" width="148" height="200" rx="12" class="card"/>
  <text class="t name" x="900" y="228">RDS</text>
  <text class="t sub" x="900" y="254">PostgreSQL 16</text>
  <text class="t sub" x="900" y="278">지표 · 판정</text>
  <text class="t sub" x="900" y="300">실행 증거(JSON)</text>
  <text class="t sub" x="900" y="330">60일 초과분은</text>
  <text class="t sub" x="900" y="352">시간별 집계 이관</text>

  <!-- EventBridge Scheduler -->
  <rect x="330" y="560" width="212" height="120" rx="12" class="card"/>
  <text class="t name" x="352" y="600">EventBridge</text>
  <text class="t name" x="352" y="626">Scheduler</text>
  <text class="t sub" x="352" y="654">5분 · 12시간 주기</text>

  <!-- Scheduled tasks -->
  <rect x="608" y="470" width="230" height="86" rx="12" class="card"/>
  <text class="t name" x="630" y="506">AutoProber</text>
  <text class="t sub" x="630" y="532">5분 · 28개 채널 실측</text>

  <rect x="608" y="588" width="230" height="86" rx="12" class="card"/>
  <text class="t name" x="630" y="624">Insights</text>
  <text class="t sub" x="630" y="650">5분 · AI 이상 징후 요약</text>

  <rect x="608" y="706" width="230" height="86" rx="12" class="card"/>
  <text class="t name" x="630" y="742">ParityRun</text>
  <text class="t sub" x="630" y="768">12시간 · 6×19 패리티 스윕</text>

  <!-- Provider stack (right, outside cloud) -->
  <rect x="1096" y="48" width="268" height="772" rx="18" fill="#FBF1EC" stroke="#EEBFAA" stroke-width="1.6"/>
  <text class="m lbl" x="1120" y="80" fill="#8E4830">LLM 프로바이더 · 5개 호출 경로</text>

  <rect x="1116" y="104" width="228" height="112" rx="12" class="card"/>
  <text class="t name" x="1136" y="142">Bedrock Global</text>
  <text class="t sub" x="1136" y="168">global.* 추론 프로파일</text>
  <text class="m sub" x="1136" y="192" font-size="12.5">Claude 7개 모델</text>

  <rect x="1116" y="240" width="228" height="112" rx="12" class="card"/>
  <text class="t name" x="1136" y="278">Bedrock US</text>
  <text class="t sub" x="1136" y="304">us.* 추론 프로파일</text>
  <text class="m sub" x="1136" y="328" font-size="12.5">Claude 7개 + Nova 1개</text>

  <rect x="1116" y="376" width="228" height="112" rx="12" class="card"/>
  <text class="t name" x="1136" y="414">Anthropic CP</text>
  <text class="t sub" x="1136" y="440">Claude Platform on AWS</text>
  <text class="m sub" x="1136" y="464" font-size="12.5">Claude 6개 모델</text>

  <rect x="1116" y="512" width="228" height="112" rx="12" class="card"/>
  <text class="t name" x="1136" y="550">Bedrock Mantle</text>
  <text class="t sub" x="1136" y="576">OpenAI 호환 /openai/v1</text>
  <text class="m sub" x="1136" y="600" font-size="12.5">GPT 5개 채널 (3리전)</text>

  <rect x="1116" y="648" width="228" height="112" rx="12" class="card"/>
  <text class="t name" x="1136" y="686">OpenAI 1P</text>
  <text class="t sub" x="1136" y="712">api.openai.com 직접 호출</text>
  <text class="m sub" x="1136" y="736" font-size="12.5">GPT 2개 모델</text>

  <text class="m" x="1230" y="800" font-size="14" font-weight="700" fill="#8E4830" text-anchor="middle">총 28개 모델 채널</text>

  <!-- Flows -->
  <!-- user -> cloudfront -->
  <path class="flow" d="M248 190 H322" marker-end="url(#ar)"/>
  <text class="t edge" x="256" y="180">HTTPS</text>
  <!-- cloudfront -> alb -->
  <path class="flow" d="M436 214 V264" marker-end="url(#ar)"/>
  <!-- alb -> frontend -->
  <path class="flow" d="M542 300 H570 V166 H600" marker-end="url(#ar)"/>
  <text class="t edge" x="548" y="230">/*</text>
  <!-- alb -> backend -->
  <path class="flow" d="M542 320 H600" marker-end="url(#ar)"/>
  <text class="t edge" x="548" y="342">/api/*</text>
  <!-- backend -> rds -->
  <path class="flow" d="M838 306 H872" marker-end="url(#ar)"/>
  <!-- scheduler -> tasks -->
  <path class="flow" d="M542 600 H575 V513 H600" marker-end="url(#ar)"/>
  <path class="flow" d="M542 620 H575 V631 H600" marker-end="url(#ar)"/>
  <path class="flow" d="M542 640 H575 V749 H600" marker-end="url(#ar)"/>
  <text class="t edge" x="548" y="586">RunTask</text>
  <!-- tasks -> rds -->
  <path class="flow" d="M954 749 V388" marker-end="url(#ar)"/>
  <path class="flow" d="M838 513 H954" fill="none"/>
  <path class="flow" d="M838 631 H954" fill="none"/>
  <path class="flow" d="M838 749 H954" fill="none"/>
  <circle cx="954" cy="631" r="3" fill="#5F5A4D"/>
  <circle cx="954" cy="749" r="3" fill="#5F5A4D"/>
  <text class="t edge" x="862" y="560">지표·증거 저장</text>
  <!-- probing paths (accent): AutoProber + ParityRun → provider bus -->
  <path class="flowA" d="M838 490 H1072" fill="none"/>
  <path class="flowA" d="M838 780 H1072" fill="none"/>
  <path class="flowA" d="M1072 780 V160 H1108" marker-end="url(#arA)"/>
  <path class="flowA" d="M1072 296 H1108" marker-end="url(#arA)"/>
  <path class="flowA" d="M1072 432 H1108" marker-end="url(#arA)"/>
  <path class="flowA" d="M1072 568 H1108" marker-end="url(#arA)"/>
  <path class="flowA" d="M1072 704 H1108" marker-end="url(#arA)"/>
  <circle cx="1072" cy="296" r="3.5" fill="#D97757"/>
  <circle cx="1072" cy="432" r="3.5" fill="#D97757"/>
  <circle cx="1072" cy="568" r="3.5" fill="#D97757"/>
  <circle cx="1072" cy="704" r="3.5" fill="#D97757"/>
  <circle cx="1072" cy="490" r="3.5" fill="#D97757"/>
  <text class="t edgeA" x="1058" y="150" text-anchor="end">실측 프로브 호출</text>
</svg>
