# CI — push/PR마다 백엔드·프론트엔드·CDK 회귀 검증 (2026-07-09 도입).
# 로컬 `make verify`와 같은 검증을 자동화한다. 배포는 하지 않는다 (AWS 자격증명 불필요).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 컨테이너 런타임과 동일 버전 (Dockerfile: python:3.11)
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  frontend:
    name: frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  cdk:
    name: cdk (tsc + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      # aws-cdk-lib 2.254~2.256.0의 npm ci lockfile 버그(#37949) 회피 — Makefile과 동일 fallback
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      # jest가 Template.fromStack으로 전 스택을 synth하므로 별도 cdk synth 불필요
      - run: npx jest --ci
