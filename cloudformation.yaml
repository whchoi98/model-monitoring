AWSTemplateFormatVersion: '2010-09-09'
Description: 'Bedrock Model Monitoring - CloudFront -> ALB -> EC2 (existing VPC)'

Metadata:
  "AWS::CloudFormation::Interface":
    ParameterGroups:
      - Label:
          default: "Existing VPC Configuration"
        Parameters:
         - VpcId
         - VpcCIDR
         - PublicSubnetA
         - PublicSubnetB
         - PrivateSubnetA
         - CloudFrontPrefixListId
      - Label:
          default: "Monitoring Configuration"
        Parameters:
         - InstanceType
         - ProbeIntervalSeconds

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "Existing VPC ID"

  VpcCIDR:
    Type: String
    Default: "10.254.0.0/16"
    Description: "VPC CIDR block (for SSM SG)"

  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: "Existing Public Subnet A (for ALB)"

  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: "Existing Public Subnet B (for ALB)"

  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: "Existing Private Subnet A (for EC2)"

  CloudFrontPrefixListId:
    Type: String
    Description: "CloudFront origin-facing managed prefix list ID"

  InstanceType:
    Type: String
    Default: t3.medium
    Description: "EC2 Instance Type"
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large

  ProbeIntervalSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    Description: "Probe interval in seconds"

  AmazonLinux2023AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64

Resources:
  # ============================================================
  # Security Groups
  # ============================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ALB SG - HTTP from CloudFront only"
      GroupName: !Sub '${AWS::StackName}-ALB-SG'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: "HTTP from CloudFront origin-facing only"
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ALB-SG'

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "EC2 SG - Next.js from ALB only"
      GroupName: !Sub '${AWS::StackName}-EC2-SG'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: "Next.js port from ALB only"
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-EC2-SG'

  # ============================================================
  # IAM Role (SSM + Bedrock)
  # ============================================================
  MonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: BedrockInvokeModel
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "arn:aws:bedrock:*::foundation-model/*"
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Role'

  MonitoringInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref MonitoringRole

  # ============================================================
  # EC2 Instance
  # ============================================================
  MonitoringServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmazonLinux2023AmiId
      IamInstanceProfile: !Ref MonitoringInstanceProfile
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/user-data.log) 2>&1
          echo "=== Starting monitoring server setup at $(date) ==="

          dnf update -y --allowerasing
          dnf install -y python3 python3-pip

          # Decode and extract application code
          APP_DIR=/home/ec2-user/model-monitoring
          echo '' | base64 -d | tar xz -C /home/ec2-user/

          APP_DIR=/home/ec2-user/model-monitoring
          chown -R ec2-user:ec2-user $APP_DIR

          # Install Python dependencies
          pip3 install -r $APP_DIR/requirements.txt

          # Overwrite config with correct probe interval
          cat > $APP_DIR/config.yaml << 'CFGEOF'
          aws:
            region: us-east-1
          models:
            - id: "us.anthropic.claude-opus-4-5-20251101-v1:0"
              name: "Claude Opus 4.5"
            - id: "us.anthropic.claude-opus-4-6-v1"
              name: "Claude Opus 4.6"
            - id: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
              name: "Claude Sonnet 4.5"
            - id: "us.amazon.nova-2-lite-v1:0"
              name: "Nova 2.0 Lite"
          probing:
            interval_seconds: ${ProbeIntervalSeconds}
            max_tokens: 256
            temperature: 0.1
            prompts:
              - "Explain what cloud computing is in 2-3 sentences."
              - "What is 15 multiplied by 27?"
          db:
            path: "monitoring.db"
          CFGEOF

          chown ec2-user:ec2-user $APP_DIR/config.yaml

          # Systemd: Prober
          cat > /etc/systemd/system/bedrock-prober.service << 'SVCEOF'
          [Unit]
          Description=Bedrock Model Monitoring Prober
          After=network.target
          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/home/ec2-user/model-monitoring
          ExecStart=/usr/bin/python3 run_prober.py
          Restart=always
          RestartSec=30
          [Install]
          WantedBy=multi-user.target
          SVCEOF

          # Systemd: Dashboard
          cat > /etc/systemd/system/bedrock-dashboard.service << 'SVCEOF'
          [Unit]
          Description=Bedrock Model Monitoring Dashboard
          After=network.target
          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/home/ec2-user/model-monitoring
          ExecStart=/usr/bin/python3 run_dashboard.py
          Restart=always
          RestartSec=10
          [Install]
          WantedBy=multi-user.target
          SVCEOF

          systemctl daemon-reload
          systemctl enable --now bedrock-prober
          systemctl enable --now bedrock-dashboard

          echo "=== Setup complete at $(date) ===" | tee -a /var/log/user-data.log
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Server'

  # ============================================================
  # ALB
  # ============================================================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-ALB"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: 3600
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ALB'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: MonitoringServer
    Properties:
      Name: !Sub "${AWS::StackName}-TG"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: "/api/health"
      HealthCheckPort: "3000"
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: 200
      Targets:
        - Id: !Ref MonitoringServer
          Port: 3000
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30
        - Key: stickiness.enabled
          Value: true
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: 86400
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-TG'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: 403
            ContentType: text/plain
            MessageBody: Access Denied

  ALBListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Custom-Secret
            Values:
              - !Sub '${AWS::StackName}-secret-${AWS::AccountId}'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ============================================================
  # CloudFront
  # ============================================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Bedrock Monitoring Dashboard - ${AWS::StackName}"
        Origins:
          - Id: ALBOrigin
            DomainName: !GetAtt ALB.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
            OriginCustomHeaders:
              - HeaderName: X-Custom-Secret
                HeaderValue: !Sub '${AWS::StackName}-secret-${AWS::AccountId}'
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
            Headers: ['*']
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
        PriceClass: PriceClass_All
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Restrictions:
          GeoRestriction:
            RestrictionType: none
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-CF'

Outputs:
  DashboardURL:
    Description: "Dashboard URL (CloudFront)"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  InstanceId:
    Description: "EC2 Instance ID (for SSM)"
    Value: !Ref MonitoringServer

  SSMCommand:
    Description: "SSM session command"
    Value: !Sub "aws ssm start-session --target ${MonitoringServer} --region ${AWS::Region}"

  Architecture:
    Description: "Network path"
    Value: "CloudFront (HTTPS) -> ALB (HTTP:80 + Custom Header) -> EC2 (Next.js:3000)"
